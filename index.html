<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0f1a" />
    <meta name="description" content="上班回血器：根据本地时间自动计算今天和本月已赚金额。" />
    <title>上班回血器</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <link rel="manifest" href="manifest.json" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <div>
          <h1>上班回血器</h1>
          <p>打开即自动结算，给打工人一点赛博回血。</p>
        </div>
        <button id="openSettings" class="ghost-btn" type="button" aria-label="打开设置">⋯</button>
      </header>

      <section class="earnings" aria-live="polite">
        <div class="status-row"><span class="status-kicker">状态</span><strong id="statusText" class="status-badge">--</strong></div>
        <div class="today-card">
          <p class="label">今天已赚</p>
          <p class="value" id="todayValue">¥0.00</p>
        </div>
        <div class="summary-grid">
          <article>
            <p class="label">本月累计</p>
            <p class="sub-value" id="monthValue">¥0.00</p>
          </article>
          <article>
            <p class="label">当前时薪</p>
            <p class="sub-value" id="hourlyValue">¥0.00 / h</p>
          </article>
        </div>
      </section>
    </main>

    <dialog id="settingsModal" class="settings-modal">
      <form id="settingsForm" method="dialog" novalidate>
        <div class="modal-header">
          <h2 aria-label="打开设置">⋯</h2>
          <button type="button" id="closeSettings" class="ghost-btn">关闭</button>
        </div>

        <label>
          月到手工资（元）
          <input id="monthlySalary" name="monthlySalary" type="number" min="0" step="100" required />
        </label>

        <label>
          当月工作天数
          <div class="inline-input">
            <input id="workDaysPerMonth" name="workDaysPerMonth" type="number" min="1" max="31" step="1" />
            <button type="button" id="recalcWorkDays" class="secondary-btn">自动计算</button>
          </div>
          <small id="workdayHint">默认按中国节假日规则估算，可手动修改。</small>
        </label>

        <div class="time-grid">
          <label>
            上班时间
            <input id="workStart" name="workStart" type="time" value="09:00" />
          </label>
          <label>
            下班时间
            <input id="workEnd" name="workEnd" type="time" value="18:00" />
          </label>
          <label>
            午休开始
            <input id="lunchStart" name="lunchStart" type="time" value="12:00" />
          </label>
          <label>
            午休结束
            <input id="lunchEnd" name="lunchEnd" type="time" value="13:00" />
          </label>
        </div>

        <fieldset class="weekday-fieldset">
          <legend>工作日选择</legend>
          <div class="weekday-options" id="weekdayOptions"></div>
        </fieldset>

        <button type="submit">保存设置</button>
        <p class="hint" id="saveHint">设置会自动保存在本地浏览器。</p>
      </form>
    </dialog>

    <script src="app.js"></script>
  </body>
</html>
